<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>MIDI Capture</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #141619; --panel: #1d2024; --panel2: #24282d; --well: #101215; --edge: #2c3036;
      --text: #f1f0ec; --dim: #858a93; --silk: #b9bdc5; --grid: #1f2328; --bar: #2f343b;
      --ok: #3ddc84; --bad: #ff5a6a; color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4a4e55; --panel: #555a62; --panel2: #5d626a; --well: #41454b; --edge: #6a6f78;
      --text: #f6f5f1; --dim: #c9ccd1; --silk: #e1e3e6; --grid: #484c53; --bar: #5a5f67;
      --ok: #7ef0ae; --bad: #ff9aa3;
    }
    [data-color="yellow"] { --acc: #ffd23f; --acc2: #f5a623; --ink: #1f1600; }
    [data-color="orange"] { --acc: #ffa94d; --acc2: #ff6b3d; --ink: #1f0c00; }
    [data-color="red"]    { --acc: #ff6b6b; --acc2: #e0334f; --ink: #1f0508; }
    [data-color="green"]  { --acc: #2ee6a6; --acc2: #9be14a; --ink: #0b1a10; }
    [data-color="blue"]   { --acc: #4cc3ff; --acc2: #5b6cff; --ink: #06131f; }
    [data-color="pink"]   { --acc: #ff86c8; --acc2: #ff4f8b; --ink: #1f0612; }
    [data-color="purple"] { --acc: #c08bff; --acc2: #7b5cff; --ink: #12081f; }
    [data-theme="grey"][data-color="yellow"] { --acc: #ffdc66; --acc2: #ffb648; }
    [data-theme="grey"][data-color="orange"] { --acc: #ffbd73; --acc2: #ff8a63; }
    [data-theme="grey"][data-color="red"]    { --acc: #ff8f8f; --acc2: #ff5c74; }
    [data-theme="grey"][data-color="green"]  { --acc: #5ff0bd; --acc2: #b8ee7a; }
    [data-theme="grey"][data-color="blue"]   { --acc: #7fd4ff; --acc2: #8f9bff; }
    [data-theme="grey"][data-color="pink"]   { --acc: #ffa6d6; --acc2: #ff79a8; }
    [data-theme="grey"][data-color="purple"] { --acc: #d4adff; --acc2: #a08bff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 12.5px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; overflow: hidden; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    svg { display: block; }
    .top { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--edge); }
    h1 { flex: 1; white-space: nowrap; margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 10.5px; margin-left: 4px; font-variant-numeric: tabular-nums; cursor: default; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; }
    .theme button { width: 26px; height: 22px; border: 0; border-radius: 7px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel2); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select { background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 7px; font-size: 12px; font-weight: 700; }
    .colors { position: relative; }
    #colorBtn { width: 30px; height: 28px; border-radius: 9px; border: 1px solid var(--edge); background: var(--well); display: grid; place-items: center; padding: 0; }
    #colorBtn i, .sw { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), var(--acc2)); display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
    #colorBtn.open { border-color: var(--acc); }
    .menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: 150px; padding: 5px; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; }
    .menu[hidden] { display: none; }
    .menu button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-weight: 700; font-size: 12px; text-align: left; }
    .menu button:hover { background: var(--well); }
    .menu button span { flex: 1; }
    .menu button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
    .menu button.on svg { visibility: visible; }


    main { flex: 1; min-height: 0; padding: 10px 12px; display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr; gap: 10px; }
    .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 14px; padding: 7px 12px; }
    .bar > label { color: var(--dim); font-size: 10.5px; font-weight: 800; white-space: nowrap; }
    .bar select { flex-shrink: 0; }
    .bar select { font-size: 11.5px; max-width: 190px; }

    .pick { position: relative; flex-shrink: 0; }
    #pickBtn { display: flex; align-items: center; gap: 7px; max-width: 210px; border: 0; border-radius: 9px; background: var(--well); padding: 5px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
    #pickName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pickBtn svg { width: 11px; height: 11px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .7; transition: transform .15s; }
    #pickBtn.open svg { transform: rotate(180deg); }
    .pd { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--dim); opacity: .45; transition: opacity .4s, box-shadow .4s, background .4s; }
    .pd.warm { background: #4cd98a; opacity: 1; box-shadow: 0 0 0 3px rgba(76,217,138,.18); }
    .pd.hit { background: #8dffbf; box-shadow: 0 0 0 4px rgba(76,217,138,.45); transition: none; }
    .pickMenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; width: 330px; max-height: 340px; overflow: auto; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
    .phint { margin: 4px 8px 6px; font-size: 10.5px; color: var(--dim); line-height: 1.35; }
    .prow { display: grid; grid-template-columns: 8px 1fr auto 12px; align-items: center; gap: 9px; width: 100%; border: 0; background: none; border-radius: 8px; padding: 7px 8px; text-align: left; cursor: pointer; font-size: 12px; }
    .prow:hover { background: var(--panel2); }
    .prow .pn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prow .pk { font-size: 10.5px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .prow.busy .pk { color: #4cd98a; }
    .prow svg { width: 12px; height: 12px; fill: none; stroke: var(--acc2); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
    .prow.on svg { visibility: visible; }
    .prow.on .pn { color: var(--acc2); }
    .live { display: flex; align-items: center; gap: 7px; font-weight: 800; white-space: nowrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
    .live.on .dot { background: #ff5a6a; box-shadow: 0 0 0 4px rgba(255,90,106,.2); }
    .live.hit .dot { box-shadow: 0 0 0 6px rgba(255,90,106,.45); }
    #act { flex: 1; display: flex; gap: 2px; align-items: flex-end; height: 22px; min-width: 40px; }
    .mem { flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #act i { flex: 1; min-width: 2px; background: var(--well); border-radius: 2px; height: 100%; position: relative; overflow: hidden; }
    #act i b { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, var(--acc), var(--acc2)); }
    .mem { font-size: 11px; color: var(--dim); font-weight: 700; white-space: nowrap; }
    .last { border: 0; border-radius: 10px; padding: 7px 14px; font-weight: 800; font-size: 12.5px; color: var(--ink); background: linear-gradient(90deg, var(--acc), var(--acc2)); white-space: nowrap; }
    .last kbd { font: inherit; font-size: 10px; opacity: .7; margin-left: 6px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
    .list { background: var(--panel); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .list h2, .view h2 { margin: 0; font-size: 10.5px; color: var(--dim); font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
    .list h2 button { border: 0; background: none; color: var(--dim); font-size: 10.5px; font-weight: 800; padding: 0; }
    .list h2 button:hover { color: var(--bad); }
    #takes { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .tk { background: var(--well); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; cursor: pointer; text-align: left; }
    .tk:hover { border-color: var(--edge); }
    .tk.sel { border-color: color-mix(in srgb, var(--acc) 70%, transparent); background: color-mix(in srgb, var(--acc) 8%, var(--well)); }
    .tk.live { border-style: dashed; border-color: #ff5a6a; }
    .th { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; } .th b { font-size: 12.5px; }
    .when { font-size: 10.5px; color: var(--dim); font-weight: 700; white-space: nowrap; }
    .mini { height: 34px; }
    .mini svg, .roll svg { display: block; width: 100%; height: 100%; }
    .nt { fill: var(--acc); } .gl { stroke: var(--grid); stroke-width: 1; } .bl { stroke: var(--bar); stroke-width: 1.2; }
    .tf { display: flex; gap: 6px; align-items: center; min-width: 0; }
    .badge { font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
    .badge.run { background: color-mix(in srgb, #3ddc84 22%, transparent); color: #3ddc84; }
    .badge.free { background: color-mix(in srgb, #ffd23f 22%, transparent); color: #ffd23f; }
    .badge.rec { background: color-mix(in srgb, #ff5a6a 22%, transparent); color: #ff5a6a; }
    .badge.done { background: var(--panel2); color: var(--silk); }
    .inf { font-size: 10.5px; color: var(--dim); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { color: var(--dim); font-size: 12px; text-align: center; padding: 30px 10px; line-height: 1.5; }
    .view { background: var(--panel); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
    .vh { display: flex; align-items: center; gap: 10px; min-width: 0; } .vh b { font-size: 16px; white-space: nowrap; }
    .roll { flex: 1; min-height: 120px; background: var(--well); border-radius: 10px; position: relative; overflow: hidden; }
    .roll .lbl { fill: var(--dim); font-size: 9.5px; font-weight: 800; }
    .roll .ph { stroke: var(--text); stroke-width: 2; }
    .opts { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
    .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; } .f > label { color: var(--dim); font-size: 10.5px; font-weight: 800; }
    .seg { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; gap: 2px; }
    .seg button { border: 0; background: none; border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; color: var(--dim); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    .seg button:hover:not(:disabled) { color: var(--text); }
    .seg button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 55%, transparent); }
    .chk { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--silk); padding: 5px 0; }
    .chk input { accent-color: var(--acc2); margin: 0; }
    .btns { display: flex; gap: 8px; }
    .btn { height: 40px; border-radius: 12px; border: 1px solid var(--edge); background: var(--well); font-weight: 800; font-size: 13px; padding: 0 16px; white-space: nowrap; }
    .btn:hover:not(:disabled) { border-color: var(--silk); }
    .go { flex: 1; height: 40px; border: 0; border-radius: 12px; font-weight: 800; font-size: 14px; color: var(--ink); background: linear-gradient(90deg, var(--acc), var(--acc2)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; }
    button:disabled { opacity: .35; cursor: default; }
    .foot { padding: 7px 12px; border-top: 1px solid var(--edge); min-height: 31px; }
    .status { font-size: 12px; color: var(--dim); text-align: center; }
    .tk.aim { border: 1px dashed var(--acc2); }
    .ghost { position: fixed; z-index: 90; pointer-events: none; padding: 6px 10px; border-radius: 9px; font-size: 11.5px; font-weight: 800; color: var(--ink); background: linear-gradient(90deg, var(--acc), var(--acc2)); box-shadow: 0 8px 22px rgba(0,0,0,.4); transform: translate(10px, 10px); white-space: nowrap; }
    body.dragging, body.dragging * { cursor: grabbing !important; }
    .aimbar { display: flex; align-items: center; gap: 10px; background: var(--well); border: 1px dashed var(--acc2); border-radius: 12px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; }
    .aimbar span { flex: 1; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  </style>
</head>
<body>
  <div class="top">
    <h1>MIDI Capture <small id="ver"></small></h1>
    <button id="help">?</button>
    <div class="colors">
      <button id="colorBtn" aria-haspopup="true"><i></i></button>
      <div class="menu" id="colorMenu" hidden></div>
    </div>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </div>
  <main>
    <section class="bar">
      <span class="live" id="live"><span class="dot"></span><span id="liveTxt"></span></span>
      <label id="inLbl"></label><div class="pick"><button id="pickBtn"><span class="pd" data-dev=""></span><span id="pickName"></span><svg viewBox="0 0 12 12"><path d="M3 4.5L6 7.5L9 4.5"/></svg></button><div class="pickMenu" id="pickMenu" hidden></div></div>
      <label id="chLbl"></label><select id="chan"></select>
      <label id="gapLbl"></label><select id="gap"></select>
      <div id="act"></div>
      <button class="last" id="last"></button>
    </section>
    <section class="list"><h2><span id="tkTitle"></span><button id="clearAll"></button></h2><div id="takes"></div></section>
    <section class="view" id="view"></section>
  </main>
  <div class="foot"><div class="status" id="status" role="status"></div></div>
  <script src="vendor/luna.global.js"></script>
  <script src="tour.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
